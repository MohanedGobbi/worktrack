# Publish a release when a version tag (vX.Y.Z) is pushed. Servers install published releases only, so work
# pushed to main never reaches them. If the tag does not match VERSION, or any test or lint step fails, nothing
# is published. Release routine: python scripts/release.py patch   (see docs/guides/INSTALL_LINUX.md)
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG VERSION=$FILE"
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like vX.Y.Z"; exit 1; }
          [ "$TAG" = "$FILE" ] || { echo "Tag v$TAG does not match VERSION ($FILE)"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (errors that break at runtime)
        run: ruff check --select E9,F63,F7,F82 --exclude staticfiles,media .

      - name: Check
        env: { SECRET_KEY: ci-only, DEBUG: 'False' }
        run: python manage.py check --deploy --fail-level ERROR

      - name: Tests
        env: { SECRET_KEY: ci-only }
        run: python manage.py test

      - name: Updater script syntax
        run: |
          for f in deploy/linux/*.sh deploy/build_package.sh; do bash -n "$f"; done

      - name: Build package
        run: bash deploy/build_package.sh "${GITHUB_REF_NAME#v}" dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/worktrack-*.tar.gz dist/SHA256SUMS \
            --title "WorkTrack Pro ${GITHUB_REF_NAME}" --generate-notes
