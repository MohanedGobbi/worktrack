# WorkTrack Pro site. __DOMAIN__ is filled in by install.sh / the updater (from /etc/worktrack/install.conf).
# Add HTTPS with: certbot --nginx -d __DOMAIN__
server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 30m;

    location /static/ {
        alias /opt/worktrack/app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Uploads go through Django so they keep the safe headers (no scripts, html downloads only).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
