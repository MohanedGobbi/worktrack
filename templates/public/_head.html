{% load static %}<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="{{ wt_theme.brand|default:'#0033a0' }}">
{% if site_config.logo %}<link rel="icon" type="image/png" href="{{ site_config.logo.url }}">{% else %}<link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">{% endif %}
<link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
{% include 'includes/wt_theme.html' %}
<link rel="stylesheet" href="{% static 'wt/app.css' %}?v=47">
<link rel="stylesheet" href="{% static 'wt/public.css' %}?v=8">
<style>html.lenis, html.lenis body { height: auto; } .lenis.lenis-smooth { scroll-behavior: auto !important; } .lenis.lenis-stopped { overflow: hidden; }</style>
<script>
  window.__forceLanguageReload = true;
  window.__defaultSystemLanguage = "{{ site_settings.default_language|default:'ar' }}";
</script>
<script src="{% static 'js/i18n.js' %}?v=3.2"></script>
<script type="importmap">{ "imports": { "three": "{% static 'vendor/three/three.module.min.js' %}" } }</script>
