{% if user.is_authenticated %}
<!-- GLOBAL STRATEGIC TODO NOTES DRAWER & BACKDROP -->
<div class="wp-notes-backdrop" id="strategicDrawerBackdrop" onclick="toggleStrategicDrawer(true)"></div>

<div class="wp-notes-panel d-print-none" id="strategicNotesDrawer" aria-label="Todo Notes">
    <!-- Edge protruding arrow button on panel border: visible on viewport edge on every page -->
    <button type="button" class="drawer-border-arrow-btn" onclick="toggleStrategicDrawer()" title="Todo Notes / الملاحظات وقائمة المهام" aria-label="Toggle Todo Notes">
        <i class="fas fa-chevron-right icon-close-arrow"></i>
        <i class="fas fa-chevron-left icon-open-arrow"></i>
    </button>

    <div class="wp-notes-header">
        <h5 class="wp-notes-title" style="display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 700;">
            <i class="fas fa-clipboard-check text-success"></i>
            <span class="lang-en">Todo Notes</span>
            <span class="lang-ar">الملاحظات وقائمة المهام</span>
        </h5>
        <div class="d-flex align-items-center gap-2">
{% if sb_rules.org_intelligence != False %}
            <a href="{% url 'organizational-intelligence' %}" class="btn btn-sm btn-light border rounded-pill px-2 py-1 text-muted" title="Open Full View" style="font-size: 0.72rem;">
                <i class="fas fa-external-link-alt"></i>
            </a>
{% endif %}
            <button type="button" class="wp-notes-close" onclick="toggleStrategicDrawer(true)" aria-label="Close">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <div class="wp-notes-body" id="dashTodoListContainer">
        <!-- Rendered via JavaScript -->
    </div>

    <div class="wp-notes-footer">
        <textarea class="wp-notes-input" id="newStrategicNoteInput" rows="3" placeholder="Draft a new todo note or action item..."></textarea>
        <button type="button" class="wp-notes-submit" onclick="submitSimpleStrategicNote()">
            <i class="fas fa-plus me-1"></i>
            <span class="lang-en">Save Note</span>
            <span class="lang-ar">حفظ الملاحظة</span>
        </button>
    </div>
</div>

<!-- Floating Trigger Button -->
<div class="wp-floating-notes-btn d-print-none" id="generalTodoToggle" onclick="toggleStrategicDrawer()" title="Todo Notes">
    <i class="fas fa-clipboard-list"></i>
    <div id="drawerGlobalBadge" class="wp-note-trigger-badge" style="display: none;">0</div>
</div>

<script>
    (function () {
        if (window.__globalNotesDrawerInitialized) return;
        window.__globalNotesDrawerInitialized = true;

        const CSRF_TOKEN = "{{ csrf_token }}";
        let allFetchedTodos = [];

        function LOCALIZE(en, ar) {
            return (document.documentElement.dir === 'rtl' || document.body.classList.contains('rtl-mode')) ? ar : en;
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast-premium shadow-lg ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} me-2"></i> ${escapeHtml(String(msg ?? ''))}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // Toggle Drawer
        window.toggleStrategicDrawer = function (forceClose) {
            const drawer = document.getElementById('strategicNotesDrawer');
            const backdrop = document.getElementById('strategicDrawerBackdrop');
            if (!drawer) return;
            let isOpen;
            if (forceClose === true) {
                drawer.classList.remove('open');
                isOpen = false;
            } else if (forceClose === false) {
                drawer.classList.add('open');
                isOpen = true;
            } else {
                isOpen = drawer.classList.toggle('open');
            }
            if (backdrop) backdrop.classList.toggle('active', isOpen);
            document.body.classList.toggle('wp-notes-open', isOpen);

            // Responsive container adaptation (LTR / RTL)
            const mainArea = document.querySelector('.dashboard-main-area');
            if (mainArea) {
                const isRTL = document.documentElement.dir === 'rtl' || document.body.classList.contains('rtl-mode');
                mainArea.style.transition = 'margin-left 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), margin-right 0.4s cubic-bezier(0.165, 0.84, 0.44, 1)';
                if (isOpen && window.innerWidth > 991) {
                    if (isRTL) {
                        mainArea.style.marginLeft = '420px';
                        mainArea.style.marginRight = '0';
                    } else {
                        mainArea.style.marginRight = '420px';
                        mainArea.style.marginLeft = '0';
                    }
                } else {
                    mainArea.style.marginRight = '0';
                    mainArea.style.marginLeft = '0';
                }
            }

            if (isOpen) {
                loadModuleTodos('all');
            }
        };

        // Escape key closes drawer
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const drawer = document.getElementById('strategicNotesDrawer');
                if (drawer && drawer.classList.contains('open')) {
                    window.toggleStrategicDrawer(true);
                }
            }
        });

        // Quick Add Helper
        window.quickAddTodo = function () {
            toggleStrategicDrawer(false);
            setTimeout(() => {
                const inp = document.getElementById('newStrategicNoteInput');
                if (inp) inp.focus();
            }, 300);
        };

        // Load Action Items / Todos
        window.loadModuleTodos = async function (slug = 'all') {
            const container = document.getElementById('dashTodoListContainer');
            if (!container) return;
            container.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-success" style="width: 1.75rem; height: 1.75rem; border-width: 2.5px;"></div>
                    <p class="mt-3 text-muted small fw-bold text-uppercase letter-spacing-1">${LOCALIZE('Loading Todo Notes...', 'جارٍ تحميل الملاحظات...')}</p>
                </div>
            `;

            try {
                const response = await fetch(`{% url 'module-todo-list-ajax' '0' %}`.replace('0', slug));
                const data = await response.json();
                if (data.status === 'success') {
                    allFetchedTodos = data.todos || [];
                    renderTodos(allFetchedTodos);
                    updateGlobalBadge();
                } else {
                    container.innerHTML = `<div class="alert alert-danger m-3 small">${escapeHtml(data.message || 'Error loading notes')}</div>`;
                }
            } catch (e) {
                container.innerHTML = `<div class="alert alert-danger m-3 small">${LOCALIZE('Connection lost.', 'تم فقدان الاتصال.')}</div>`;
            }
        };

        // Render Todo Item Cards
        function renderTodos(todos) {
            const container = document.getElementById('dashTodoListContainer');
            if (!container) return;

            if (!todos || todos.length === 0) {
                container.innerHTML = `
                    <div class="wp-empty py-5 text-center">
                        <i class="fas fa-clipboard-list mb-3" style="font-size:3rem; color: #cbd5e1;"></i>
                        <h5 style="color:#0f172a; font-weight:800;">${LOCALIZE('No Todo Notes', 'لا توجد ملاحظات')}</h5>
                        <p style="color:#64748b; font-size: 0.9rem;">${LOCALIZE('Start drafting notes below to keep track of tasks.', 'ابدأ بكتابة الملاحظات أدناه لمتابعة مهامك.')}</p>
                    </div>
                `;
                return;
            }

            let html = '';
            todos.forEach(todo => {
                const isCompleted = Boolean(todo.is_completed);
                const dateStr = todo.created_at || (todo.due_date ? (LOCALIZE('Due: ', 'الاستحقاق: ') + todo.due_date) : '');
                html += `
                    <div class="wp-note-card ${isCompleted ? 'completed' : ''}" id="note-card-${todo.id}">
                        <div class="wp-note-header-info">
                            <span class="wp-note-time"><i class="far fa-clock"></i> ${escapeHtml(dateStr)}</span>
                            <div class="wp-note-actions">
                                <button class="wp-note-btn wp-note-btn-check" onclick="toggleTodoStatus(${todo.id})" title="${isCompleted ? LOCALIZE('Mark pending', 'إعادة للانتظار') : LOCALIZE('Mark complete', 'تحديد كمكتمل')}">
                                    <i class="fas ${isCompleted ? 'fa-undo' : 'fa-check'}"></i>
                                </button>
                                ${!isCompleted ? `<button class="wp-note-btn wp-note-btn-edit" onclick="startEditSimpleNote(${todo.id})" title="${LOCALIZE('Edit', 'تعديل')}"><i class="fas fa-pen"></i></button>` : ''}
                                <button class="wp-note-btn wp-note-btn-del" onclick="deleteTodo(${todo.id})" title="${LOCALIZE('Delete', 'حذف')}"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="wp-note-text" id="note-text-${todo.id}">${escapeHtml(todo.title)}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Inline Card Editing
        window.startEditSimpleNote = function (id) {
            const todo = allFetchedTodos.find(t => t.id === id);
            if (!todo) return;
            const card = document.getElementById('note-card-' + id);
            if (!card) return;
            const safeText = escapeHtml(todo.title || '');
            card.innerHTML = `
                <div class="wp-note-header-info">
                    <span class="wp-note-time"><i class="fas fa-pen text-primary"></i> ${LOCALIZE('Editing Note', 'تعديل الملاحظة')}</span>
                    <button class="wp-note-btn wp-note-btn-del" onclick="loadModuleTodos('all')"><i class="fas fa-times"></i> ${LOCALIZE('Cancel', 'إلغاء')}</button>
                </div>
                <textarea class="wp-note-edit-input" id="edit-input-${id}" rows="3">${safeText}</textarea>
                <button class="wp-note-save-btn" onclick="saveEditSimpleNote(${id})">${LOCALIZE('Update Note', 'تحديث الملاحظة')}</button>
            `;
        };

        window.saveEditSimpleNote = async function (id) {
            const input = document.getElementById('edit-input-' + id);
            if (!input) return;
            const newText = input.value.trim();
            if (!newText) return;

            const fd = new FormData();
            fd.append('title', newText);
            fd.append('priority', 'medium');

            try {
                const res = await fetch(`{% url 'module-todo-update' 0 %}`.replace('0', id), {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': CSRF_TOKEN,
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: fd
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showToast(LOCALIZE('Note updated successfully!', 'تم تحديث الملاحظة بنجاح!'));
                    loadModuleTodos('all');
                    updateGlobalBadge();
                } else {
                    showToast(data.message || LOCALIZE('Error updating note', 'خطأ في التحديث'), 'danger');
                }
            } catch (err) {
                showToast(LOCALIZE('Error updating note', 'خطأ في التحديث'), 'danger');
            }
        };

        // Submit New Note from footer textarea
        window.submitSimpleStrategicNote = async function () {
            const input = document.getElementById('newStrategicNoteInput');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;

            const fd = new FormData();
            fd.append('title', text);
            fd.append('priority', 'medium');

            try {
                const res = await fetch(`{% url 'module-todo-add' 'general' %}`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': CSRF_TOKEN,
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: fd
                });
                const data = await res.json();
                if (data.status === 'success') {
                    input.value = '';
                    showToast(LOCALIZE('Note created successfully!', 'تم حفظ الملاحظة بنجاح!'));
                    loadModuleTodos('all');
                    updateGlobalBadge();
                } else {
                    showToast(data.message || LOCALIZE('Error saving note', 'خطأ في حفظ الملاحظة'), 'danger');
                }
            } catch (err) {
                showToast(LOCALIZE('Error processing request.', 'حدث خطأ أثناء معالجة الطلب.'), 'danger');
            }
        };

        // Toggle Status
        window.toggleTodoStatus = function (id) {
            fetch("{% url 'module-todo-toggle' 0 %}".replace('0', id), {
                method: 'POST',
                headers: { 'X-CSRFToken': CSRF_TOKEN, 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(r => r.json())
            .then(d => {
                if (d.status === 'success') {
                    showToast(LOCALIZE('Status updated!', 'تم تحديث الحالة!'));
                    loadModuleTodos('all');
                    updateGlobalBadge();
                }
            })
            .catch(() => showToast(LOCALIZE('Failed to update status', 'فشل في تحديث الحالة'), 'danger'));
        };

        // Delete Todo
        window.deleteTodo = function (id) {
            const msg = LOCALIZE('Are you sure you want to delete this note?', 'هل أنت متأكد من حذف هذه الملاحظة؟');
            if (!confirm(msg)) return;

            fetch("{% url 'module-todo-delete' 0 %}".replace('0', id), {
                method: 'POST',
                headers: { 'X-CSRFToken': CSRF_TOKEN, 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(r => r.json())
            .then(d => {
                if (d.status === 'success') {
                    showToast(LOCALIZE('Note deleted!', 'تم حذف الملاحظة!'));
                    loadModuleTodos('all');
                    updateGlobalBadge();
                }
            })
            .catch(() => showToast(LOCALIZE('Failed to delete note', 'فشل في حذف الملاحظة'), 'danger'));
        };

        // Global Badge Counter
        function updateGlobalBadge() {
            const badge = document.getElementById('drawerGlobalBadge');
            if (!badge) return;
            fetch("{% url 'module-todo-list-ajax' 'all' %}")
                .then(r => r.json())
                .then(d => {
                    if (d.status === 'success') {
                        const count = (d.todos || []).filter(t => !t.is_completed).length;
                        if (count > 0) {
                            badge.innerText = count;
                            badge.style.display = 'flex';
                        } else {
                            badge.style.display = 'none';
                        }
                    }
                })
                .catch(() => {});
        }

        // Initialize on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateGlobalBadge);
        } else {
            updateGlobalBadge();
        }
    })();
</script>
{% endif %}
