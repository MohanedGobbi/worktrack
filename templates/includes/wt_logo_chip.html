{% comment %}Customer logo (theme layer). Without an uploaded logo, a typographic monogram stands in.{% endcomment %}<span class="wt-logo-chip{% if wt_theme.logo_tone == 'light' %} wt-logo-chip--on-brand{% endif %}">{% if site_config.logo %}<img src="{{ site_config.logo.url }}" alt="{{ site_config.app_name|default:'WorkTrack Pro' }}">{% else %}<span class="wt-monogram" aria-hidden="true">wt</span>{% endif %}</span>
