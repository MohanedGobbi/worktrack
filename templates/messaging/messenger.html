{% load static %}
<div id="messenger-wrapper" class="messenger-collapsed">
    <!-- Messenger Toggle Button -->
    <button id="messenger-toggle" class="btn btn-primary shadow-lg rounded-circle">
        <i class="fas fa-comment-dots fa-lg"></i>
        <span id="unread-messenger-badge" class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle" style="display: none;">0</span>
    </button>

    <!-- Messenger Main Container -->
    <div id="messenger-container" class="glass-messenger" style="display: none; flex-direction: column;">
        <!-- Header -->
        <div class="messenger-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-bold"><i class="fas fa-paper-plane me-2 text-primary"></i> Messenger</h6>
            <div class="d-flex gap-2">
                <button id="messenger-back" class="btn btn-sm btn-link text-muted p-0" style="display: none;"><i class="fas fa-chevron-left"></i></button>
                <button id="messenger-close" class="btn btn-sm btn-link text-muted p-0"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <!-- Contact List View -->
        <div id="messenger-contact-view" class="msg-panel">
            <div class="messenger-search p-2">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white border-0"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" id="contact-search" class="form-control border-0" placeholder="Search contacts...">
                </div>
            </div>
            <div id="messenger-contacts" class="msg-scroll-area p-0">
                <!-- Contacts will be populated here -->
                <div class="text-center p-4 text-muted small">
                    <i class="fas fa-user-clock d-block mb-2 fa-2x opacity-25"></i>
                    Loading contacts...
                </div>
            </div>
        </div>

        <!-- Chat View -->
        <div id="messenger-chat-view" class="msg-panel">
            <!-- Sub-header: active contact -->
            <div class="msg-chat-header d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div id="active-contact-avatar" class="msg-avatar me-2"></div>
                    <div>
                        <div id="active-contact-name" class="fw-bold small text-dark"></div>
                        <div id="active-contact-status" class="text-muted" style="font-size: 0.7rem;">Active Now</div>
                    </div>
                </div>
                <button id="messenger-switch-contact" class="btn btn-sm btn-outline-primary rounded-pill px-2 py-0" style="font-size: 0.7rem;" title="Switch Contact">
                    <i class="fas fa-users"></i>
                </button>
            </div>

            <!-- Pinned bar -->
            <div id="popup-pinned-bar" class="msg-pinned-bar d-none">
                <div class="d-flex align-items-center gap-1 overflow-hidden">
                    <i class="fas fa-thumbtack text-primary" style="font-size: 0.6rem;"></i>
                    <div id="popup-pinned-preview" class="text-truncate">Pinned...</div>
                </div>
                <button class="btn btn-sm btn-link text-primary p-0" style="font-size: 0.6rem;" onclick="alert('See all pinned messages feature coming soon!')"><span class="lang-en">View</span><span class="lang-ar">عرض</span></button>
            </div>

            <!-- Scrollable messages area -->
            <div id="messenger-chat-body" class="msg-scroll-area p-3">
                <div id="messenger-popup-load-more" class="text-center py-2" style="display: none;">
                    <button class="btn btn-sm btn-outline-primary rounded-pill" style="font-size: 0.7rem;">Load older</button>
                </div>
            </div>

            <!-- ===== FOOTER: always locked at bottom ===== -->
            <div id="msg-footer" class="msg-footer">
                <!-- File attached preview -->
                <div id="popup-file-preview" class="msg-mini-bar" style="display: none !important;">
                    <div class="small fw-bold text-truncate" style="max-width: 150px;">File Attached</div>
                    <button type="button" id="popup-cancel-file-btn" class="btn btn-sm text-muted p-0 ms-auto"><i class="fas fa-times"></i></button>
                </div>
                <!-- Reply preview -->
                <div id="popup-reply-preview-bar" class="msg-mini-bar" style="display: none !important;">
                    <div class="text-truncate">
                        <i class="fas fa-reply text-primary me-1"></i>
                        <span id="popup-reply-preview-text"></span>
                    </div>
                    <button type="button" id="popup-cancel-reply-btn" class="btn btn-sm text-muted p-0"><i class="fas fa-times"></i></button>
                </div>
                <!-- Typing indicator -->
                <div id="popup-typing-indicator" style="display: none; font-size: 0.65rem; padding: 2px 8px; color: var(--text-muted);">
                    <span id="popup-typing-text">Someone is typing...</span>
                </div>
                <!-- Recording bar (Dark System Glass + Glowing Green Effect) -->
                <div id="popup-recording-bar" class="popup-recording-panel" style="display: none !important;">
                    <div class="d-flex align-items-center gap-2">
                        <div class="recording-pulse-wrapper">
                            <span class="recording-pulse-ring"></span>
                            <span class="recording-dot-green"></span>
                        </div>
                        <div class="recording-equalizer">
                            <span class="eq-bar"></span>
                            <span class="eq-bar"></span>
                            <span class="eq-bar"></span>
                            <span class="eq-bar"></span>
                        </div>
                        <div class="d-flex align-items-center gap-2 text-white">
                            <span class="fw-bold recording-label">Voice Recording...</span>
                            <span id="popup-recording-timer" class="recording-timer-badge">0:00</span>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-1">
                        <button type="button" id="popup-cancel-recording" class="rec-btn-cancel" title="Discard">
                            <i class="fas fa-trash-alt me-1"></i> Discard
                        </button>
                        <button type="button" id="popup-stop-recording" class="rec-btn-send" title="Send">
                            <i class="fas fa-paper-plane me-1"></i> Send
                        </button>
                    </div>
                </div>
                <!-- Message input form -->
                <form id="messenger-form" class="msg-input-row">
                    <input type="hidden" id="popup-reply-to-id" value="">
                    <input type="hidden" id="popup-edit-message-id" value="">
                    <button type="button" class="msg-icon-btn" id="popup-attach-btn"><i class="fas fa-paperclip"></i></button>
                    <button type="button" class="msg-icon-btn" id="popup-mic-btn"><i class="fas fa-microphone"></i></button>
                    <div id="popup-emoji-wrapper" class="position-relative">
                        <button type="button" class="msg-icon-btn" id="popup-emoji-btn"><i class="far fa-laugh"></i></button>
                        <div id="popup-emoji-dropdown" class="bg-white shadow-lg border rounded-3 p-2 position-absolute" style="display: none; bottom: 100%; right: 0; z-index: 1200; width: 150px;">
                            <div class="d-flex flex-wrap gap-2 justify-content-center">
                                <span class="cursor-pointer" onclick="insertPopupEmoji('👍')">👍</span>
                                <span class="cursor-pointer" onclick="insertPopupEmoji('❤️')">❤️</span>
                                <span class="cursor-pointer" onclick="insertPopupEmoji('😂')">😂</span>
                                <span class="cursor-pointer" onclick="insertPopupEmoji('🔥')">🔥</span>
                                <span class="cursor-pointer" onclick="insertPopupEmoji('👏')">👏</span>
                                <span class="cursor-pointer" onclick="insertPopupEmoji('🎉')">🎉</span>
                            </div>
                        </div>
                    </div>
                    <input type="text" id="message-input" class="msg-text-input" placeholder="Write a message..." autocomplete="off">
                    <button type="submit" class="msg-send-btn" id="popup-send-btn">
                        <i class="fas fa-paper-plane" id="popup-send-icon"></i>
                    </button>
                </form>
            </div>
            <!-- ===== END FOOTER ===== -->
        </div>
    </div>

    <!-- Popup Forward Modal -->
    <div id="popup-forward-modal" class="modal fade" tabindex="-1" aria-hidden="true" style="z-index: 1100;">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 15px;">
                <div class="modal-header border-0 pb-0">
                    <h6 class="modal-title fw-bold">Forward</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="font-size: 0.6rem;"></button>
                </div>
                <div class="modal-body p-3">
                    <input type="text" id="popup-forward-search" class="form-control form-control-sm rounded-pill mb-2" placeholder="Search...">
                    <div id="popup-forward-list" style="max-height: 200px; overflow-y: auto;">
                        <!-- Contacts loaded here -->
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" id="popup-confirm-forward-btn" class="btn btn-primary btn-sm rounded-pill w-100" disabled>Forward</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* ============================================================
   MESSENGER POPUP — FULL REVISED LAYOUT
   Popup: 400px wide × 580px tall
   Structure:
     [header ~48px] [top-level panel fills rest]
       Panel = contact-list  OR  chat-view
       chat-view = [sub-header] [scrollable messages] [footer ALWAYS visible]
============================================================ */

:root {
    --msg-bg:          #ffffff;
    --msg-primary:     #0084ff;
    --msg-received:    #e4e6eb;
    --msg-sent:        #0084ff;
    --msg-text:        #050505;
    --msg-muted:       #65676b;
    --msg-border:      #e4e6eb;
    --msg-radius:      14px;
    --msg-popup-w:     400px;
    --msg-popup-h:     580px;
    --msg-header-h:    48px;
    --msg-subhdr-h:    48px;
    --msg-footer-h:    60px;
}

/* --- Toggle button --- */
#messenger-wrapper {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1050;
}

#messenger-toggle {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    font-size: 1.4rem;
    background: var(--msg-primary);
    border: none;
    box-shadow: 0 4px 16px rgba(0,132,255,0.4);
    transition: transform 0.25s, box-shadow 0.25s;
    position: relative;
}
#messenger-toggle:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(0,132,255,0.5);
}

/* --- Main popup container --- */
.glass-messenger {
    position: absolute;
    bottom: 72px;          /* clear of toggle + gap */
    right: 0;
    width:  var(--msg-popup-w);
    height: var(--msg-popup-h);
    max-height: calc(100vh - 90px);
    min-height: 380px;
    background: var(--msg-bg);
    border: 1px solid var(--msg-border);
    border-radius: var(--msg-radius);
    box-shadow: 0 16px 40px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: msgSlideIn 0.2s ease-out;
}
@keyframes msgSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* --- Top header (Messenger title + close btn) --- */
.messenger-header {
    flex-shrink: 0;
    height: var(--msg-header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: var(--msg-bg);
    border-bottom: 1px solid var(--msg-border);
}
.messenger-header h6 {
    color: var(--msg-text);
    font-weight: 700;
    margin: 0;
    font-size: 0.95rem;
}

/* --- Generic panel (fills remaining height after .messenger-header) --- */
.msg-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Contact view visible by default; chat view hidden until a contact is chosen */
#messenger-contact-view { display: flex; }
#messenger-chat-view    { display: none; }

/* --- Scrollable area (contacts list OR messages) --- */
.msg-scroll-area {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: var(--msg-bg);
    display: flex;
    flex-direction: column;
}
.msg-scroll-area::-webkit-scrollbar { width: 5px; }
.msg-scroll-area::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.12);
    border-radius: 10px;
}

/* --- Chat sub-header --- */
.msg-chat-header {
    flex-shrink: 0;
    height: var(--msg-subhdr-h);
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--msg-bg);
    border-bottom: 1px solid var(--msg-border);
}

/* --- Avatar in chat sub-header --- */
.msg-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--msg-primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    flex-shrink: 0;
    border: 1px solid var(--msg-border);
}

/* --- Pinned bar --- */
.msg-pinned-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.7rem;
    padding: 4px 10px;
    background: #eef4ff;
    border-bottom: 1px solid var(--msg-border);
}

/* --- Footer: always locked at bottom, never hidden --- */
.msg-footer {
    flex-shrink: 0;
    background: var(--msg-bg);
    border-top: 1px solid var(--msg-border);
    position: sticky;
    bottom: 0;
    z-index: 10;
}

/* Mini bars inside footer (reply, file, recording preview) */
.msg-mini-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    font-size: 0.78rem;
    color: var(--msg-muted);
    background: #f5f5f5;
    border-bottom: 1px solid var(--msg-border);
}

/* --- Input row (always the last child of .msg-footer) --- */
.msg-input-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    min-height: var(--msg-footer-h);
    background: var(--msg-bg);
    margin: 0;
}

.msg-icon-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: #f0f2f5;
    color: var(--msg-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s;
    padding: 0;
}
.msg-icon-btn:hover { background: #e4e6eb; }

.msg-text-input {
    flex: 1;
    min-width: 0;
    border: none;
    background: #f0f2f5;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 0.85rem;
    color: var(--msg-text);
    outline: none;
    box-shadow: none;
}
.msg-text-input:focus {
    background: #e8eaed;
    outline: none;
    box-shadow: none;
}

.msg-send-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--msg-primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    padding: 0;
}
.msg-send-btn:hover {
    background: #006fdd;
    transform: scale(1.05);
}

/* --- Contact items inside scroll area --- */
.contact-item {
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    border-radius: 8px;
    margin: 2px 8px;
    transition: background 0.15s;
    flex-shrink: 0;
}
.contact-item:hover { background: var(--msg-received); }

/* --- Message bubbles --- */
.message-bubble {
    max-width: 78%;
    margin-bottom: 6px;
    padding: 8px 12px;
    border-radius: 18px;
    font-size: 0.875rem;
    line-height: 1.45;
    position: relative;
    flex-shrink: 0;
    word-break: break-word;
    animation: msgBubbleIn 0.12s ease-out;
}
@keyframes msgBubbleIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
}
.message-sent {
    background: var(--msg-sent) !important;
    color: #fff !important;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
}
.message-received {
    background: var(--msg-received) !important;
    color: var(--msg-text) !important;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
}
.message-time {
    font-size: 0.68rem;
    color: var(--msg-muted);
    margin-top: 3px;
    display: none;
}
.message-bubble:hover .message-time { display: block; }

/* --- Message actions (react/reply/etc) --- */
.message-actions {
    display: flex;
    gap: 3px;
    opacity: 0;
    transition: opacity 0.15s;
    padding: 0 6px;
    margin-bottom: 2px;
}
.message-bubble:hover .message-actions { opacity: 1; }
.action-btn {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--msg-muted);
    font-size: 11px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
.action-btn:hover { background: var(--msg-received); }

/* --- Misc --- */
.recording-dot {
    width: 8px; height: 8px;
    background: var(--wt-bad);
    border-radius: 50%;
    display: inline-block;
    animation: blink 1s infinite;
}
@keyframes blink {
    0%,100% { opacity:1; } 50% { opacity:0; }
}

/* --- Modern Dark Glass Recording Panel --- */
.popup-recording-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: linear-gradient(135deg, #09111e 0%, #0f172a 100%) !important;
    border-top: 1px solid color-mix(in srgb, var(--color-primary, #10b981) 45%, transparent) !important;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4) !important;
    z-index: 20;
}
.recording-pulse-wrapper {
    position: relative;
    width: 12px;
    height: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.recording-pulse-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(var(--wt-brand-rgb), 0.6);
    animation: recPulse 1.5s ease-out infinite;
}
.recording-dot-green {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff9d;
    box-shadow: 0 0 8px #00ff9d;
}
@keyframes recPulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(2.2); opacity: 0; }
}

.recording-equalizer {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 14px;
}
.recording-equalizer .eq-bar {
    width: 3px;
    background: #00ff9d;
    border-radius: 4px;
    animation: eqBounce 1.2s ease-in-out infinite alternate;
}
.recording-equalizer .eq-bar:nth-child(1) { height: 60%; animation-delay: 0.1s; }
.recording-equalizer .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.3s; }
.recording-equalizer .eq-bar:nth-child(3) { height: 40%; animation-delay: 0.2s; }
.recording-equalizer .eq-bar:nth-child(4) { height: 80%; animation-delay: 0.4s; }

@keyframes eqBounce {
    0% { transform: scaleY(0.3); }
    100% { transform: scaleY(1.1); }
}

.recording-label {
    font-size: 0.75rem;
    color: #ffffff !important;
    letter-spacing: 0.02em;
}
.recording-timer-badge {
    font-family: monospace;
    font-size: 0.72rem;
    font-weight: 700;
    color: #00ff9d !important;
    background: rgba(0, 255, 157, 0.12) !important;
    border: 1px solid rgba(0, 255, 157, 0.3) !important;
    padding: 2px 8px;
    border-radius: 6px;
}

.rec-btn-cancel {
    background: rgba(192, 40, 58, 0.15);
    border: 1px solid rgba(192, 40, 58, 0.3);
    color: #f87171 !important;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}
.rec-btn-cancel:hover {
    background: rgba(192, 40, 58, 0.3);
    color: #ffffff !important;
}

.rec-btn-send {
    background: var(--color-primary, #10b981) !important;
    border: 1px solid var(--color-secondary, color-mix(in oklab, var(--wt-brand) 62%, #000)) !important;
    color: #ffffff !important;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 10px color-mix(in srgb, var(--color-primary, #10b981) 45%, transparent);
    transition: all 0.2s;
}
.rec-btn-send:hover {
    background: var(--color-secondary, color-mix(in oklab, var(--wt-brand) 62%, #000)) !important;
    box-shadow: 0 0 14px rgba(192, 40, 58, 0.6);
    transform: translateY(-1px);
}

/* --- Custom Voice Message Player Widget in Bubbles --- */
.custom-voice-player-container {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 12px;
    background: #0f172a !important;
    border: 1px solid #334155 !important;
    min-width: 190px;
    max-width: 230px;
    margin-top: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    color: #ffffff !important;
}
.voice-sent, .voice-received {
    background: #0f172a !important;
    color: #ffffff !important;
    border: 1px solid #334155 !important;
}

.voice-play-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--color-primary, #10b981) !important;
    color: var(--color-portal-bg, color-mix(in oklab, var(--wt-brand) 62%, #000)) !important;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    flex-shrink: 0;
    transition: transform 0.15s, background 0.15s;
}
.voice-play-btn:hover {
    transform: scale(1.08);
    background: var(--color-accent, #34d399) !important;
}

.voice-controls-wrapper {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.voice-seekbar-container {
    display: flex;
    align-items: center;
}
.voice-range-slider {
    width: 100%;
    height: 4px;
    accent-color: #00ff9d;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 4px;
    cursor: pointer;
}
.voice-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.68rem;
    font-family: monospace;
    color: rgba(255, 255, 255, 0.85);
}
.voice-speed-badge {
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
}
.voice-speed-badge:hover {
    background: rgba(0, 0, 0, 0.6);
}
.message-deleted { font-style: italic; opacity: 0.6; }
.message-edited  { font-size: 10px; opacity: 0.6; margin-left: 4px; }
.message-reply-preview {
    background: rgba(0,0,0,0.06);
    border-left: 3px solid var(--msg-primary);
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 4px;
    font-size: 0.75rem;
    opacity: 0.85;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.message-sent .message-reply-preview {
    background: rgba(255,255,255,0.2);
    border-left-color: #fff;
}
.reaction-bar {
    display: flex; gap: 2px;
    position: absolute; bottom: -10px; z-index: 5;
}
.sent .reaction-bar { right: 10px; }
.received .reaction-bar { left: 10px; }
.reaction-badge {
    background: var(--msg-bg);
    border: 1px solid var(--msg-border);
    border-radius: 12px;
    padding: 1px 5px;
    font-size: 11px;
    display: flex; align-items: center; gap: 2px;
    cursor: pointer;
    transition: transform 0.1s;
}
.reaction-badge:hover { transform: scale(1.1); }
.reaction-badge.reacted { background: rgba(0,132,255,0.1); border-color: var(--msg-primary); }
.voice-message-player { width: 100%; max-width: 220px; margin-top: 6px; }
.message-attachment {
    margin-top: 6px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--msg-border);
}
.message-attachment img {
    max-width: 100%; max-height: 200px;
    display: block; object-fit: contain;
}
.attachment-link {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    text-decoration: none;
    color: inherit;
    font-size: 0.8rem;
    background: rgba(0,0,0,0.03);
    border-radius: 6px;
}
.attachment-link:hover { background: rgba(0,0,0,0.06); }
</style>

<script>
    (function() {
        const toggleBtn = document.getElementById('messenger-toggle');
        const container = document.getElementById('messenger-container');
        const closeBtn = document.getElementById('messenger-close');
        const backBtn = document.getElementById('messenger-back');
        const switchContactBtn = document.getElementById('messenger-switch-contact');
        const contactView = document.getElementById('messenger-contact-view');
        const chatView = document.getElementById('messenger-chat-view');
        const contactsList = document.getElementById('messenger-contacts');
        const chatBody = document.getElementById('messenger-chat-body');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        
        let activeChatId = null;
        let pollInterval = null;
        let conversationsState = []; 
        let currentOffset = 0;
        let hasMoreMessages = false;
        let isLoadingMessages = false;
        let popupActiveIsGroup = false;

        toggleBtn.addEventListener('click', () => {
            if (container.style.display === 'none') {
                container.style.display = 'flex';
                loadConversations();
            } else {
                container.style.display = 'none';
                stopPolling();
            }
        });

        closeBtn.addEventListener('click', () => {
            container.style.display = 'none';
            stopPolling();
        });

        function goToContacts() {
            chatView.style.display = 'none';
            contactView.style.display = 'flex';
            backBtn.style.display = 'none';
            activeChatId = null;
            stopPolling();
            loadConversations();
        }

        backBtn.addEventListener('click', goToContacts);
        if (switchContactBtn) {
            switchContactBtn.addEventListener('click', goToContacts);
        }

        let popupConversationsState = [];
        function loadContacts() {
            fetch("{% url 'messaging:api-get-conversations' %}")
                .then(r => r.json())
                .then(data => {
                    popupConversationsState = data.conversations || [];
                    contactsList.innerHTML = '';
                    if (popupConversationsState.length === 0) {
                        // Fallback to contacts if conversations empty
                        fetch("{% url 'messaging:api-get-contacts' %}")
                            .then(r => r.json())
                            .then(cData => {
                                popupConversationsState = cData.contacts || [];
                                if (popupConversationsState.length === 0) {
                                    contactsList.innerHTML = '<div class="text-center p-4 text-muted small">No contacts or conversations found.</div>';
                                    return;
                                }
                                popupConversationsState.forEach(c => {
                                    const div = document.createElement('div');
                                    div.className = 'contact-item d-flex align-items-center p-2 border-bottom cursor-pointer hover-bg-light';
                                    div.innerHTML = `
                                        <div class="avatar-sm me-3 rounded-circle bg-light text-primary d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px; flex-shrink: 0; border: 1px solid var(--border-color);">
                                            ${c.initial}
                                        </div>
                                        <div class="flex-grow-1 overflow-hidden">
                                            <div class="fw-bold small text-dark text-truncate">${c.full_name}</div>
                                            <div class="text-muted text-truncate" style="font-size: 0.75rem;">${c.role}</div>
                                        </div>
                                    `;
                                    div.onclick = () => openChat(c);
                                    contactsList.appendChild(div);
                                });
                            });
                        return;
                    }
                    popupConversationsState.forEach((conv) => {
                        const div = document.createElement('div');
                        div.className = 'contact-item d-flex align-items-center p-2 border-bottom cursor-pointer hover-bg-light';
                        div.setAttribute('data-conv-id', conv.id);
                        div.innerHTML = `
                            <div class="avatar-sm me-3 rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px; flex-shrink: 0;">
                                ${conv.initial || '?'}
                            </div>
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="fw-bold small text-dark text-truncate">${conv.name || 'Chat'}</div>
                                <div class="text-muted text-truncate" style="font-size: 0.75rem;">${conv.last_message || (conv.is_group ? 'Group Chat' : 'Tap to message')}</div>
                            </div>
                        `;
                        div.onclick = () => openChat(conv);
                        contactsList.appendChild(div);
                    });
                }).catch(() => {
                    fetch("{% url 'messaging:api-get-contacts' %}")
                        .then(r => r.json())
                        .then(data => {
                            popupConversationsState = data.contacts || [];
                            contactsList.innerHTML = '';
                            if (popupConversationsState.length === 0) {
                                contactsList.innerHTML = '<div class="text-center p-4 text-muted small">No contacts found.</div>';
                                return;
                            }
                            popupConversationsState.forEach(contact => {
                                const div = document.createElement('div');
                                div.className = 'contact-item d-flex align-items-center p-2 border-bottom cursor-pointer hover-bg-light';
                                div.innerHTML = `
                                    <div class="avatar-sm me-3 rounded-circle bg-light text-primary d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px; flex-shrink: 0; border: 1px solid var(--border-color);">
                                        ${contact.initial}
                                    </div>
                                    <div class="flex-grow-1 overflow-hidden">
                                        <div class="fw-bold small text-dark text-truncate">${contact.full_name}</div>
                                        <div class="text-muted text-truncate" style="font-size: 0.75rem;">${contact.role}</div>
                                    </div>
                                `;
                                div.onclick = () => openChat(contact);
                                contactsList.appendChild(div);
                            });
                        });
                });
        }
        function loadConversations() { loadContacts(); }

        function openChat(conv) {
            activeChatId = conv.id;
            popupActiveIsGroup = conv.is_group;
            
            document.getElementById('active-contact-name').innerText = conv.name;
            document.getElementById('active-contact-avatar').innerText = conv.initial;
            document.getElementById('active-contact-avatar').className = conv.is_group
                ? 'msg-avatar me-2 rounded-3'
                : 'msg-avatar me-2';
            
            const statusText = document.getElementById('active-contact-status');
            if (conv.is_group) {
                statusText.innerText = "Group Chat";
                statusText.className = "text-muted";
            } else {
                statusText.innerText = conv.is_online ? 'Active Now' : 'Offline';
                statusText.className = conv.is_online ? 'text-success' : 'text-muted';
            }
            
            contactView.style.display = 'none';
            chatView.style.display = 'flex';
            backBtn.style.display = 'block';
            
            chatBody.innerHTML = '<div class="text-center p-3 text-muted small">Loading...</div>';
            loadMessages();
            popupLoadPinnedMessages();
            startPolling();
        }

        function loadMessages(isLoadMore = false) {
            if (!activeChatId || isLoadingMessages) return;
            
            isLoadingMessages = true;
            const currentUserId = parseInt("{{ request.user.id|default:0 }}");
            
            if (!isLoadMore) {
                currentOffset = 0;
            }
            
            const loadMoreBtn = document.getElementById('messenger-popup-load-more');
            
            fetch(`/messaging/api/messages/conv/${activeChatId}/?offset=${currentOffset}`)
                .then(r => r.json())
                .then(data => {
                    isLoadingMessages = false;
                    
                    if (!isLoadMore) {
                        const newLastMessageId = data.messages.length > 0 ? data.messages[data.messages.length - 1].id : null;
                        if (newLastMessageId === lastMessageId && lastMessageId !== null && data.total === currentOffset + data.messages.length) {
                             return; // No new messages
                        }
                        lastMessageId = newLastMessageId;
                    }
                    
                    hasMoreMessages = data.has_more;
                    
                    if (isLoadMore) {
                        currentOffset += data.messages.length;
                    } else {
                        currentOffset = data.messages.length;
                        // Keep the load more button in DOM, just clear the messages after it
                        const loadMoreDiv = chatBody.querySelector('#messenger-popup-load-more');
                        chatBody.innerHTML = '';
                        if(loadMoreDiv) chatBody.appendChild(loadMoreDiv);
                    }

                    if (hasMoreMessages) {
                        loadMoreBtn.style.display = 'block';
                    } else {
                        if (loadMoreBtn) loadMoreBtn.style.display = 'none';
                    }

                    const atBottom = chatBody.scrollHeight - chatBody.scrollTop <= chatBody.clientHeight + 50;
                    const oldScrollHeight = chatBody.scrollHeight;
                    
                    if (data.messages && data.messages.length > 0) {
                        // If load more, we prepend messages after the load more button
                        const insertAfterElement = isLoadMore ? loadMoreBtn : null;
                        
                        data.messages.forEach(msg => {
                            const isSent = parseInt(msg.sender_id) === currentUserId;
                            let attachmentHtml = '';
                            if (msg.attachment_url) {
                                if (msg.is_image) {
                                    attachmentHtml = `<div class="message-attachment"><img src="${msg.attachment_url}" alt="Image" onclick="window.open('${msg.attachment_url}')" style="cursor:pointer"></div>`;
                                } else if (msg.is_voice) {
                                    attachmentHtml = `
                                        <div class="custom-voice-player-container ${isSent ? 'voice-sent' : 'voice-received'}">
                                            <audio id="popup-voice-audio-${msg.id}" src="${msg.attachment_url}" preload="auto" onended="popupResetVoicePlayer(${msg.id})" ontimeupdate="popupUpdateVoiceProgress(${msg.id})"></audio>
                                            <button type="button" onclick="popupToggleVoicePlay(${msg.id})" id="popup-voice-play-btn-${msg.id}" class="voice-play-btn">
                                                <i class="fas fa-play" id="popup-voice-play-icon-${msg.id}"></i>
                                            </button>
                                            <div class="voice-controls-wrapper">
                                                <div class="voice-seekbar-container">
                                                    <input type="range" id="popup-voice-seek-${msg.id}" min="0" max="100" value="0" step="0.1" oninput="popupSeekVoiceAudio(${msg.id}, this.value)" class="voice-range-slider">
                                                </div>
                                                <div class="voice-meta-row">
                                                    <span><i class="fas fa-microphone text-rose me-1"></i><span id="popup-voice-time-${msg.id}">0:00</span></span>
                                                    <button type="button" onclick="popupToggleVoiceSpeed(${msg.id})" id="popup-voice-speed-${msg.id}" class="voice-speed-badge">1x</button>
                                                </div>
                                            </div>
                                        </div>`;
                                } else {
                                    const fileName = msg.attachment_url.split('/').pop();
                                    attachmentHtml = `
                                        <div class="message-attachment">
                                            <a href="${msg.attachment_url}" target="_blank" class="attachment-link">
                                                <i class="fas fa-file-alt"></i>
                                                <span class="text-truncate" style="max-width:120px">${fileName}</span>
                                                <i class="fas fa-download ms-auto"></i>
                                            </a>
                                        </div>`;
                                }
                            }

                            let reactionsHtml = '';
                            if (msg.reactions && msg.reactions.length > 0) {
                                const grouped = {};
                                msg.reactions.forEach(r => {
                                    grouped[r.emoji] = grouped[r.emoji] || [];
                                    grouped[r.emoji].push(r);
                                });
                                reactionsHtml = `<div class="reaction-bar">`;
                                for (const [emoji, users] of Object.entries(grouped)) {
                                    const userReacted = users.some(u => u.user_id === currentUserId);
                                    reactionsHtml += `<div class="reaction-badge ${userReacted ? 'reacted' : ''}" onclick="popupReactToMessage(${msg.id}, '${emoji}')" title="${users.map(u => u.user__first_name || u.user__email).join(', ')}">${emoji} <span class="small">${users.length}</span></div>`;
                                }
                                reactionsHtml += `</div>`;
                            }
                            
                            let replyPreviewHtml = '';
                            if (msg.reply_to_id) {
                                const repliedMsg = data.messages.find(m => m.id === msg.reply_to_id);
                                if (repliedMsg) {
                                     replyPreviewHtml = `<div class="message-reply-preview" onclick="popupScrollToMessage(${msg.reply_to_id})">${repliedMsg.content.substring(0, 30)}...</div>`;
                                } else {
                                     replyPreviewHtml = `<div class="message-reply-preview">Replying to older message...</div>`;
                                }
                            }
                            
                            let actionsHtml = '';
                            if (!msg.is_deleted) {
                                actionsHtml = `
                                    <div class="message-actions">
                                        <button class="action-btn" title="React" onclick="popupReactToMessage(${msg.id}, '👍')"><i class="fas fa-smile"></i></button>
                                        <button class="action-btn" title="Reply" onclick="popupPrepareReply(${msg.id}, \`${msg.content.replace(/`/g, '\\`').substring(0, 30)}\`)"><i class="fas fa-reply"></i></button>
                                        <button class="action-btn" title="Forward" onclick="popupPrepareForward(${msg.id})"><i class="fas fa-share"></i></button>
                                        <button class="action-btn ${msg.is_pinned ? 'text-primary' : ''}" title="${msg.is_pinned ? 'Unpin' : 'Pin'}" onclick="popupTogglePin(${msg.id})"><i class="fas fa-thumbtack"></i></button>
                                        ${isSent ? `<button class="action-btn" title="Edit" onclick="popupPrepareEdit(${msg.id}, \`${msg.content.replace(/`/g, '\\`')}\`)"><i class="fas fa-edit"></i></button>` : ''}
                                        ${isSent ? `<button class="action-btn delete-btn" title="Delete" onclick="popupDeleteMessage(${msg.id})"><i class="fas fa-trash"></i></button>` : ''}
                                    </div>
                                `;
                            }

                            const row = document.createElement('div');
                            row.className = `message-bubble ${isSent ? 'message-sent' : 'message-received'} ${msg.is_deleted ? 'message-deleted' : ''}`;
                            row.dataset.msgId = msg.id;
                            row.id = `popup-msg-row-${msg.id}`;
                            row.innerHTML = `
                                ${actionsHtml}
                                ${replyPreviewHtml}
                                ${msg.content} ${msg.is_edited ? '<span class="message-edited">(edited)</span>' : ''}
                                ${attachmentHtml}
                                <span class="message-time">${msg.timestamp}</span>
                                ${reactionsHtml}
                            `;
                            
                            if (isLoadMore && insertAfterElement) {
                                insertAfterElement.after(row);
                            } else {
                                chatBody.appendChild(row);
                            }
                        });
                    } else if (!isLoadMore) {
                        chatBody.innerHTML = '<div class="text-center p-3 text-muted small">No messages yet. Say hello!</div>';
                    }
                    
                    if (isLoadMore) {
                        // Restore scroll position so it doesn't jump to top
                        chatBody.scrollTop = chatBody.scrollHeight - oldScrollHeight;
                    } else if (atBottom || currentOffset <= 20) {
                        chatBody.scrollTop = chatBody.scrollHeight;
                    }
                })
                .catch(err => {
                    isLoadingMessages = false;
                    console.error("Error loading messages", err);
                });
        }

        // Infinite scroll logic
        chatBody.addEventListener('scroll', () => {
             if (chatBody.scrollTop === 0 && hasMoreMessages && !isLoadingMessages) {
                 loadMessages(true);
             }
        });
        
        // Also attach manual load more click
        const loadMoreBtnInside = document.getElementById('messenger-popup-load-more');
        if (loadMoreBtnInside) {
             loadMoreBtnInside.querySelector('button').addEventListener('click', () => {
                 if (hasMoreMessages && !isLoadingMessages) loadMessages(true);
             });
        }

        function startPolling() {
            stopPolling();
            pollInterval = setInterval(() => {
                loadMessages();
                popupPollTypingIndicators();
            }, 3000);
        }

        function stopPolling() {
            if (pollInterval) clearInterval(pollInterval);
        }

        const fileInput = document.getElementById('popup-file-input');
        const attachBtn = document.getElementById('popup-attach-btn');
        const filePreview = document.getElementById('popup-file-preview');
        // Note: The original HTML for 'popup-file-name' was removed in favor of a simpler layout in a previous edit
        // but we'll adapt to whatever exists in the DOM.
        const cancelFile = document.getElementById('popup-cancel-file-btn');
        
        const popupReplyPreviewBar = document.getElementById('popup-reply-preview-bar');
        const popupReplyPreviewText = document.getElementById('popup-reply-preview-text');
        const popupCancelReplyBtn = document.getElementById('popup-cancel-reply-btn');
        const popupReplyToIdInput = document.getElementById('popup-reply-to-id');
        const popupEditMessageIdInput = document.getElementById('popup-edit-message-id');
        const popupSendIcon = document.getElementById('popup-send-icon');
        
        window.popupPrepareReply = function(id, text) {
            popupReplyToIdInput.value = id;
            popupEditMessageIdInput.value = '';
            popupReplyPreviewText.innerText = text;
            popupReplyPreviewBar.style.setProperty('display', 'flex', 'important');
            popupSendIcon.className = "fas fa-paper-plane";
            messageInput.focus();
        };
        
        window.popupPrepareEdit = function(id, content) {
            popupEditMessageIdInput.value = id;
            popupReplyToIdInput.value = '';
            popupReplyPreviewText.innerText = "Editing: " + content.substring(0, 30) + "...";
            popupReplyPreviewBar.style.setProperty('display', 'flex', 'important');
            messageInput.value = content;
            popupSendIcon.className = "fas fa-check";
            messageInput.focus();
        };
        
        window.popupScrollToMessage = function(id) {
            const el = document.getElementById(`popup-msg-row-${id}`);
            if (el) el.scrollIntoView({behavior: 'smooth', block: 'center'});
        };
        
        window.popupDeleteMessage = async function(id) {
            if (!await amazingConfirm('Delete this message?')) return;
            fetch(`/messaging/api/delete/${id}/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            }).then(r => r.json()).then(data => {
                if (data.status === 'success') loadMessages();
            });
        };
        
        window.popupReactToMessage = function(id, emoji) {
            fetch(`/messaging/api/react/${id}/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json' },
                body: JSON.stringify({ emoji: emoji })
            }).then(r => r.json()).then(data => {
                if (data.status === 'success') loadMessages();
            });
        };

        window.popupTogglePin = function(msgId) {
            fetch(`/messaging/api/messages/pin/${msgId}/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            }).then(r => r.json()).then(data => {
                if (data.status === 'success') {
                    loadMessages();
                    popupLoadPinnedMessages();
                }
            });
        };

        function popupLoadPinnedMessages() {
            if (!activeChatId) return;
            fetch(`/messaging/api/messages/conv/${activeChatId}/?limit=50`)
                .then(r => r.json())
                .then(data => {
                    const pinned = data.messages.filter(m => m.is_pinned);
                    const bar = document.getElementById('popup-pinned-bar');
                    const preview = document.getElementById('popup-pinned-preview');
                    if (pinned.length > 0) {
                        preview.innerText = pinned[0].content;
                        bar.classList.replace('d-none', 'd-flex');
                    } else {
                        bar.classList.replace('d-flex', 'd-none');
                    }
                });
        }

        // Typing logic
        let popupTypingTimeout;
        const typingUpdateHandler = () => {
            if (!activeChatId) return;
            if (!window.popupLastTypingSent || (Date.now() - window.popupLastTypingSent > 3000)) {
                fetch(`/messaging/api/conversations/typing-update/${activeChatId}/`, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': '{{ csrf_token }}' }
                });
                window.popupLastTypingSent = Date.now();
            }
        };
        messageInput.addEventListener('input', typingUpdateHandler);

        function popupPollTypingIndicators() {
            if (!activeChatId || container.style.display === 'none') return;
            fetch(`/messaging/api/conversations/typing-list/${activeChatId}/`)
                .then(r => r.json())
                .then(data => {
                    const el = document.getElementById('popup-typing-indicator');
                    const text = document.getElementById('popup-typing-text');
                    if (data.typing_users.length > 0) {
                        const names = data.typing_users.map(u => u.name).join(', ');
                        text.innerText = `${names.substring(0, 20)}${names.length > 20 ? '...' : ''} is typing...`;
                        el.style.display = 'block';
                    } else {
                        el.style.display = 'none';
                    }
                });
        }

        // Emoji Logic
        const popupEmojiBtn = document.getElementById('popup-emoji-btn');
        const popupEmojiDropdown = document.getElementById('popup-emoji-dropdown');
        if (popupEmojiBtn) {
            popupEmojiBtn.onclick = (e) => {
                e.stopPropagation();
                popupEmojiDropdown.style.display = popupEmojiDropdown.style.display === 'none' ? 'block' : 'none';
            };
        }
        window.insertPopupEmoji = function(emoji) {
            const start = messageInput.selectionStart;
            const end = messageInput.selectionEnd;
            const text = messageInput.value;
            messageInput.value = text.substring(0, start) + emoji + text.substring(end);
            messageInput.focus();
            popupEmojiDropdown.style.display = 'none';
        };

        const popupPollBtn = document.getElementById('popup-poll-btn');
        if (popupPollBtn) {
            popupPollBtn.onclick = () => alert("Poll creation is available on the main messenger page.");
        }

        const popupForwardModal = new bootstrap.Modal(document.getElementById('popup-forward-modal'));
        const popupForwardList = document.getElementById('popup-forward-list');
        const popupForwardSearch = document.getElementById('popup-forward-search');
        const popupConfirmForwardBtn = document.getElementById('popup-confirm-forward-btn');
        let popupSelectedRecipients = new Set();
        let popupMessageToForward = null;

        window.popupPrepareForward = function(id) {
            popupMessageToForward = id;
            popupSelectedRecipients.clear();
            popupConfirmForwardBtn.disabled = true;
            renderPopupForwardContacts();
            popupForwardModal.show();
        };

        function renderPopupForwardContacts(filter = '') {
            popupForwardList.innerHTML = '';
            popupContactsState.filter(c => c.full_name.toLowerCase().includes(filter.toLowerCase())).forEach(contact => {
                const item = document.createElement('div');
                item.className = 'contact-item rounded-3 mb-1 ' + (popupSelectedRecipients.has(contact.id) ? 'bg-primary-subtle' : '');
                item.style.padding = '5px 10px';
                item.style.cursor = 'pointer';
                item.innerHTML = `
                    <div class="d-flex align-items-center gap-2">
                        <div class="avatar-sm rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 25px; height: 25px; font-size: 0.6rem;">${contact.initial}</div>
                        <div class="flex-grow-1">
                            <div class="fw-bold" style="font-size: 0.75rem;">${contact.full_name}</div>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" style="font-size: 0.7rem;" ${popupSelectedRecipients.has(contact.id) ? 'checked' : ''}>
                        </div>
                    </div>
                `;
                item.onclick = () => {
                    if (popupSelectedRecipients.has(conv.id)) {
                        popupSelectedRecipients.delete(conv.id);
                    } else {
                        popupSelectedRecipients.add(conv.id);
                    }
                    popupConfirmForwardBtn.disabled = popupSelectedRecipients.size === 0;
                    renderPopupForwardContacts(popupForwardSearch.value);
                };
                popupForwardList.appendChild(item);
            });
        }

        popupForwardSearch.oninput = (e) => renderPopupForwardContacts(e.target.value);

        popupConfirmForwardBtn.onclick = () => {
            if (!popupMessageToForward || popupSelectedRecipients.size === 0) return;
            popupConfirmForwardBtn.disabled = true;
            fetch(`/messaging/api/forward/${popupMessageToForward}/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json' },
                body: JSON.stringify({ recipient_ids: Array.from(popupSelectedRecipients) })
            }).then(r => r.json()).then(data => {
                if (data.status === 'success') {
                    popupForwardModal.hide();
                    loadMessages();
                }
            }).finally(() => {
                popupConfirmForwardBtn.disabled = false;
            });
        };
        
        if (popupCancelReplyBtn) {
            popupCancelReplyBtn.onclick = () => {
                popupReplyToIdInput.value = '';
                popupEditMessageIdInput.value = '';
                popupReplyPreviewBar.style.setProperty('display', 'none', 'important');
                messageInput.value = '';
                popupSendIcon.className = "fas fa-paper-plane";
            };
        }

        if (attachBtn) {
            attachBtn.onclick = () => {
                if(fileInput) fileInput.click();
            }
            if(fileInput) {
                fileInput.onchange = () => {
                    if (fileInput.files.length > 0) {
                        filePreview.style.setProperty('display', 'flex', 'important');
                    }
                };
            }
            if (cancelFile) {
                cancelFile.onclick = () => {
                    if(fileInput) fileInput.value = '';
                    filePreview.style.setProperty('display', 'none', 'important');
                };
            }
        }

        if (messageForm) {
            messageForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const content = messageInput.value.trim();
                const file = fileInput ? fileInput.files[0] : null;
                
                if ((!content && !file) || !activeChatId) return;

                const isEditing = popupEditMessageIdInput.value !== '';
                const editId = popupEditMessageIdInput.value;
                const url = isEditing ? `/messaging/api/edit/${editId}/` : "{% url 'messaging:api-send-message' %}";
                
                let fetchOptions = {};
                if (isEditing) {
                    fetchOptions = {
                        method: 'POST',
                        headers: { 'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: content })
                    };
                } else {
                    const formData = new FormData();
                    formData.append('conversation_id', activeChatId);
                    formData.append('content', content);
                    if (file) formData.append('attachment', file);
                    if (popupReplyToIdInput.value) formData.append('reply_to_id', popupReplyToIdInput.value);
                    fetchOptions = {
                        method: 'POST',
                        headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                        body: formData
                    };
                }

                messageInput.value = '';
                if(fileInput) fileInput.value = '';
                if(filePreview) filePreview.style.setProperty('display', 'none', 'important');
                if (popupCancelReplyBtn) popupCancelReplyBtn.click();
                
                if (!isEditing) {
                    // Optimistic update
                    const tempId = Date.now();
                    const div = document.createElement('div');
                    div.className = `message-bubble message-sent`;
                    div.id = `popup-temp-msg-${tempId}`;
                    div.style.opacity = '0.7';
                    div.innerHTML = `${content || 'Sending file...'} <span class="message-time">Sending...</span>`;
                    chatBody.appendChild(div);
                    chatBody.scrollTop = chatBody.scrollHeight;
                }
                
                fetch(url, fetchOptions)
                .then(async r => {
                    const data = await r.json().catch(() => ({}));
                    if (!r.ok || data.error || data.status === 'error') {
                        const temp = chatBody.querySelector(`[id^="popup-temp-msg-"]`);
                        if (temp) temp.remove();
                        const errText = data.error || data.message || 'Operation forbidden by system security policy.';
                        alert(errText);
                        return;
                    }
                    if (data.status === 'success') {
                        loadMessages();
                    }
                })
                .catch(err => {
                    const temp = chatBody.querySelector(`[id^="popup-temp-msg-"]`);
                    if (temp) temp.remove();
                    console.error("Messaging error:", err);
                });
            });
        }

        // Voice Recording for Popup
        let popupMediaRecorder;
        let popupAudioChunks = [];
        let popupRecordingStartTime;
        let popupTimerInterval;
        const popupMicBtn = document.getElementById('popup-mic-btn');
        const popupRecordingBar = document.getElementById('popup-recording-bar');
        const popupRecordingTimer = document.getElementById('popup-recording-timer');
        const popupCancelRecordingBtn = document.getElementById('popup-cancel-recording');
        const popupStopRecordingBtn = document.getElementById('popup-stop-recording');

        if (popupMicBtn) {
            popupMicBtn.onclick = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    popupMediaRecorder = new MediaRecorder(stream);
                    popupAudioChunks = [];

                    popupMediaRecorder.ondataavailable = (e) => popupAudioChunks.push(e.data);
                    popupMediaRecorder.onstop = () => {
                        const blob = new Blob(popupAudioChunks, { type: 'audio/webm' });
                        if (popupAudioChunks.length > 0 && !this.popupCancelled) {
                            sendPopupVoiceMessage(blob);
                        }
                        stream.getTracks().forEach(t => t.stop());
                    };

                    popupMediaRecorder.start();
                    this.popupCancelled = false;
                    popupRecordingStartTime = Date.now();
                    popupRecordingBar.style.setProperty('display', 'flex', 'important');
                    popupTimerInterval = setInterval(() => {
                        const diff = Math.floor((Date.now() - popupRecordingStartTime) / 1000);
                        popupRecordingTimer.innerText = `${Math.floor(diff/60)}:${(diff%60).toString().padStart(2,'0')}`;
                    }, 1000);
                } catch (err) {
                    alert("Mic access denied");
                }
            };
        }

        popupCancelRecordingBtn.onclick = () => {
            this.popupCancelled = true;
            popupMediaRecorder.stop();
            clearPopupTimer();
        };

        popupStopRecordingBtn.onclick = () => {
            this.popupCancelled = false;
            popupMediaRecorder.stop();
            clearPopupTimer();
        };

        function clearPopupTimer() {
            clearInterval(popupTimerInterval);
            popupRecordingBar.style.setProperty('display', 'none', 'important');
            popupRecordingTimer.innerText = "0:00";
        }

        // Voice Player Controls for Popup Messenger
        window.popupToggleVoicePlay = function(msgId) {
            const audio = document.getElementById(`popup-voice-audio-${msgId}`);
            const icon = document.getElementById(`popup-voice-play-icon-${msgId}`);
            if (!audio || !icon) return;

            if (audio.paused) {
                document.querySelectorAll('audio[id^="popup-voice-audio-"]').forEach(a => {
                    if (a !== audio && !a.paused) {
                        a.pause();
                        const otherId = a.id.replace('popup-voice-audio-', '');
                        const otherIcon = document.getElementById(`popup-voice-play-icon-${otherId}`);
                        if (otherIcon) otherIcon.className = 'fas fa-play';
                    }
                });
                audio.volume = 1.0;
                audio.muted = false;
                audio.play().then(() => {
                    icon.className = 'fas fa-pause';
                }).catch(err => {
                    console.error("Audio playback error:", err);
                    audio.load();
                    audio.play().then(() => icon.className = 'fas fa-pause').catch(e => console.error(e));
                });
            } else {
                audio.pause();
                icon.className = 'fas fa-play';
            }
        };

        window.popupUpdateVoiceProgress = function(msgId) {
            const audio = document.getElementById(`popup-voice-audio-${msgId}`);
            const seek = document.getElementById(`popup-voice-seek-${msgId}`);
            const timeEl = document.getElementById(`popup-voice-time-${msgId}`);
            if (!audio || !seek || !timeEl) return;
            if (audio.duration && !isNaN(audio.duration)) {
                seek.value = (audio.currentTime / audio.duration) * 100;
                const mins = Math.floor(audio.currentTime / 60);
                const secs = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
                timeEl.innerText = `${mins}:${secs}`;
            }
        };

        window.popupSeekVoiceAudio = function(msgId, val) {
            const audio = document.getElementById(`popup-voice-audio-${msgId}`);
            if (!audio || !audio.duration || isNaN(audio.duration)) return;
            audio.currentTime = (val / 100) * audio.duration;
        };

        window.popupResetVoicePlayer = function(msgId) {
            const icon = document.getElementById(`popup-voice-play-icon-${msgId}`);
            const seek = document.getElementById(`popup-voice-seek-${msgId}`);
            const timeEl = document.getElementById(`popup-voice-time-${msgId}`);
            if (icon) icon.className = 'fas fa-play';
            if (seek) seek.value = 0;
            if (timeEl) timeEl.innerText = '0:00';
        };

        window.popupToggleVoiceSpeed = function(msgId) {
            const audio = document.getElementById(`popup-voice-audio-${msgId}`);
            const speedBtn = document.getElementById(`popup-voice-speed-${msgId}`);
            if (!audio || !speedBtn) return;
            const speeds = [1, 1.5, 2];
            const currentSpeed = audio.playbackRate || 1;
            const nextIdx = (speeds.indexOf(currentSpeed) + 1) % speeds.length;
            audio.playbackRate = speeds[nextIdx];
            speedBtn.innerText = `${speeds[nextIdx]}x`;
        };

        function sendPopupVoiceMessage(blob) {
            if (!activeChatId) return;
            const fd = new FormData();
            fd.append('conversation_id', activeChatId);
            fd.append('content', 'Voice Message');
            fd.append('attachment', blob, 'voice.webm');
            fetch("{% url 'messaging:api-send-message' %}", {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                body: fd
            }).then(async r => {
                const data = await r.json().catch(() => ({}));
                if (!r.ok || data.error || data.status === 'error') {
                    alert(data.error || data.message || 'Operation forbidden by system security policy.');
                    return;
                }
                if (data.status === 'success') loadMessages();
            });
        }
    })();

    // Contact search
    const contactSearch = document.getElementById('contact-search');
    if (contactSearch) {
        let popupSearchTimeout;
        contactSearch.addEventListener('input', function() {
            clearTimeout(popupSearchTimeout);
            const term = this.value.trim().toLowerCase();
            const contactsList = document.getElementById('messenger-contacts');

            document.querySelectorAll('#messenger-contacts .contact-item:not(.popup-global-search-item)').forEach(item => {
                item.style.display = (!term || item.innerText.toLowerCase().includes(term)) ? 'flex' : 'none';
            });
            
            // Search global users if query length >= 2
            if (term.length >= 2) {
                popupSearchTimeout = setTimeout(() => {
                    fetch(`/messaging/api/search-users/?q=${encodeURIComponent(term)}`)
                        .then(r => r.json()).then(data => {
                            const oldGlobalHeader = document.getElementById('popup-global-search-header');
                            if (oldGlobalHeader) oldGlobalHeader.remove();
                            document.querySelectorAll('.popup-global-search-item').forEach(e => e.remove());
                            
                            const users = data.users || [];
                            if (users.length > 0 && contactsList) {
                                const header = document.createElement('div');
                                header.id = 'popup-global-search-header';
                                header.className = 'p-2 bg-light text-muted fw-bold border-bottom border-top';
                                header.style.fontSize = '0.7rem';
                                header.innerText = 'GLOBAL USERS';
                                contactsList.appendChild(header);

                                users.forEach(u => {
                                    const div = document.createElement('div');
                                    div.className = 'contact-item popup-global-search-item d-flex align-items-center p-2 border-bottom cursor-pointer hover-bg-light';
                                    div.innerHTML = `
                                        <div class="avatar-sm me-3 rounded-circle bg-success text-white d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px; flex-shrink: 0;">
                                            ${u.initial || '?'}
                                        </div>
                                        <div class="flex-grow-1 overflow-hidden">
                                            <div class="fw-bold small text-dark text-truncate">${u.full_name}</div>
                                            <div class="text-muted text-truncate" style="font-size: 0.7rem;">${u.role || ''} (${u.email})</div>
                                        </div>
                                    `;
                                    div.onclick = () => {
                                        contactSearch.value = '';
                                        const oldHeader = document.getElementById('popup-global-search-header');
                                        if (oldHeader) oldHeader.remove();
                                        document.querySelectorAll('.popup-global-search-item').forEach(e => e.remove());
                                        document.querySelectorAll('#messenger-contacts .contact-item').forEach(e => e.style.display = 'flex');

                                        fetch(`/messaging/api/messages/${u.id}/`)
                                            .then(r=>r.json()).then(d => {
                                                if (d.conversation_id && typeof openChat === 'function') {
                                                    openChat({id: d.conversation_id, name: u.full_name, initial: u.initial||'?', is_group: false, is_online: u.is_online, other_user_id: u.id});
                                                }
                                            });
                                    };
                                    contactsList.appendChild(div);
                                });
                            }
                        });
                }, 300);
            } else {
                const oldGlobalHeader = document.getElementById('popup-global-search-header');
                if (oldGlobalHeader) oldGlobalHeader.remove();
                document.querySelectorAll('.popup-global-search-item').forEach(e => e.remove());
            }
        });
    }
</script>
